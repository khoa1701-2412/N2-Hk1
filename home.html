<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f4ef">
    <title>Trang chủ | Nếp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --ink:#202a26; --muted:#747b73; --paper:#f6f4ef; --green:#345d4e; --line:#dedfd7; --accent:#d78668; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:"DM Sans",sans-serif; }
        .topbar { min-height:78px; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:16px clamp(24px,7vw,100px); border-bottom:1px solid var(--line); }
        .brand { display:inline-flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; font-size:20px; font-weight:700; }
        .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:50% 50% 50% 12px; background:var(--green); color:white; font:21px "Playfair Display",serif; }
        .account-actions { display:flex; align-items:center; gap:16px; }
        .account-email { color:var(--muted); font-size:13px; }
        .sign-out { min-height:40px; padding:0 14px; border:1px solid var(--line); border-radius:5px; background:transparent; color:var(--ink); cursor:pointer; font-size:13px; font-weight:700; }
        .sign-out:hover { border-color:var(--green); color:var(--green); }
        main { max-width:1320px; margin:0 auto; padding:48px clamp(24px,7vw,100px) 72px; }
        .welcome { position:relative; min-height:min(68vh,650px); display:flex; align-items:flex-end; overflow:hidden; padding:clamp(28px,6vw,72px); background:#667463; color:white; }
        .welcome::before { position:absolute; inset:0; content:""; background:linear-gradient(90deg,#15241cbb 0%,#15241c45 72%),url("https://images.unsplash.com/photo-1449247709967-d4461a6a6103?auto=format&fit=crop&w=1800&q=85") center/cover; }
        .welcome-copy { position:relative; max-width:650px; animation:arrive 650ms ease both; }
        .eyebrow { margin:0 0 18px; color:#f3d2c3; font-size:11px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; }
        h1 { margin:0; font:600 clamp(38px,6vw,68px)/1.08 "Playfair Display",Georgia,serif; }
        .welcome-copy p:last-child { max-width:460px; margin:20px 0 0; color:#ffffffd9; font-size:15px; line-height:1.7; }
        .account-status { display:flex; align-items:center; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid #ffffff55; color:#ffffffdf; font-size:13px; }
        .status-mark { width:9px; height:9px; border-radius:50%; background:#a8d7ac; box-shadow:0 0 0 4px #a8d7ac30; }
        button:focus-visible,a:focus-visible { outline:3px solid #d7866870; outline-offset:3px; }
        @keyframes arrive { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        @media(max-width:600px) { .topbar { align-items:flex-start; flex-direction:column; gap:14px; } .account-actions { width:100%; justify-content:space-between; } main { padding-top:24px; } .welcome { min-height:68vh; } }
        @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="home.html" aria-label="Nếp, trang chủ"><span class="brand-mark" aria-hidden="true">n</span><span>nếp</span></a>
        <div class="account-actions">
            <span class="account-email" id="account-email"></span>
            <button class="sign-out" id="sign-out-button" type="button">Đăng xuất</button>
        </div>
    </header>
    <main>
        <section class="welcome" aria-labelledby="welcome-title">
            <div class="welcome-copy">
                <p class="eyebrow">Không gian của bạn</p>
                <h1 id="welcome-title">Chào mừng trở lại<span id="user-name"></span>.</h1>
                <p>Một nơi nhỏ để bạn bắt đầu ngày mới theo nhịp điệu của riêng mình.</p>
                <div class="account-status"><span class="status-mark" aria-hidden="true"></span><span>Email đã xác minh và tài khoản đang hoạt động.</span></div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        (async () => {
            const config = window.SUPABASE_CONFIG || {};
            if (!config.url || !config.anonKey) {
                window.location.replace("test.html");
                return;
            }

            const authClient = window.supabase.createClient(config.url, config.anonKey);
            const { data, error } = await authClient.auth.getUser();
            if (error || !data.user) {
                window.location.replace("test.html");
                return;
            }

            document.querySelector("#account-email").textContent = data.user.email;
            const name = data.user.user_metadata?.full_name;
            if (name) document.querySelector("#user-name").textContent = `, ${name}`;
            document.querySelector("#sign-out-button").addEventListener("click", async () => {
                await authClient.auth.signOut({ scope: "local" });
                window.location.replace("test.html");
            });
        })();
    </script>
</body>
</html>
